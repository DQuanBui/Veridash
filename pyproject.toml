[project]
name = "veridash"
version = "1.4.0"
description = "Drop your data. Trust every number. Verifiable, AI-assisted data analysis (Streamlit)."
requires-python = ">=3.11"
authors = [{ name = "Quan Bui", email = "dbui10@fordham.edu" }]
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:google.*"]
