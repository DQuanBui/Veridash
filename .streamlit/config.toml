# Veridash theme. Light and dark follow the visitor's system setting by default;
# visitors can switch in the app menu (top right) > Settings.
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "monospace"
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
base = "light"
primaryColor = "#0D9488"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
borderColor = "#E2E8F0"
linkColor = "#0F766E"
chartCategoricalColors = ["#0D9488", "#6366F1", "#F59E0B", "#EC4899", "#0EA5E9", "#84CC16", "#8B5CF6", "#F97316"]

[theme.light.sidebar]
backgroundColor = "#F8FAFC"

[theme.dark]
base = "dark"
primaryColor = "#0D9488"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131C2E"
textColor = "#E2E8F0"
borderColor = "#243045"
linkColor = "#5EEAD4"
chartCategoricalColors = ["#0D9488", "#6366F1", "#D97706", "#DB2777", "#0284C7", "#65A30D", "#7C3AED", "#EA580C"]

[theme.dark.sidebar]
backgroundColor = "#0F1729"

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[server]
maxUploadSize = 50
runOnSave = false

[browser]
gatherUsageStats = false
