# Veridash theme. Light and dark follow the visitor's system setting by default;
# visitors can switch in the app menu (top right) > Settings.
[theme]
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap, sans-serif"
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap, sans-serif"
codeFont = "monospace"
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
base = "light"
primaryColor = "#0D9488"
backgroundColor = "#F5F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#10213A"
borderColor = "#DCE4EC"
linkColor = "#0F766E"
chartCategoricalColors = ["#0D9488", "#6366F1", "#F59E0B", "#EC4899", "#0EA5E9", "#84CC16", "#8B5CF6", "#F97316"]

[theme.light.sidebar]
backgroundColor = "#EDF2F7"

[theme.dark]
base = "dark"
primaryColor = "#0D9488"
backgroundColor = "#0A1322"
secondaryBackgroundColor = "#121D31"
textColor = "#E2E8F0"
borderColor = "#243045"
linkColor = "#5EEAD4"
chartCategoricalColors = ["#0D9488", "#6366F1", "#D97706", "#DB2777", "#0284C7", "#65A30D", "#7C3AED", "#EA580C"]

[theme.dark.sidebar]
backgroundColor = "#0D1729"

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[server]
maxUploadSize = 50
runOnSave = false

[browser]
gatherUsageStats = false
